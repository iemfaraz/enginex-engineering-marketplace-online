services:
  - type: web
    name: enginex-engineering-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enginex-marketplace-db
          property: connectionString
      # Administrator login. The password is generated by Render: open the service ->
      # Environment -> ADMIN_PASSWORD to read it, or replace it with your own.
      - key: ADMIN_EMAIL
        value: admin@enginex.com
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: enginex-marketplace-db
    plan: free
    region: frankfurt
    databaseName: enginex
    user: enginex
    ipAllowList: []
