<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="./favicon.svg">
<title>ENGINEX — Engineering Marketplace & Jobs Platform</title>
<meta name="description" content="ENGINEX engineering marketplace and jobs platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1D37;--navy2:#12305a;--gold:#D4A017;--gold-d:#b6870f;--blue:#1D4ED8;--blue-l:#e8effe;
  --bg:#F5F7FB;--card:#fff;--ink:#0F1B2D;--mut:#5B6B82;--line:#E2E8F1;--ok:#117a45;--ok-bg:#e6f6ee;
  --warn:#9a6a00;--warn-bg:#fff4d6;--err:#b42318;--err-bg:#fdecea;--r:12px;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2c94c;outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em;color:var(--navy)}
h1{font-size:clamp(30px,4.6vw,50px);font-weight:800}
h2{font-size:clamp(22px,2.6vw,30px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:12px}
.hide{display:none!important}
.only-s{display:none}

/* header */
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.nav{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:.02em}
.brand:hover{text-decoration:none}
.brand svg{width:34px;height:34px}
.links{display:flex;gap:2px;margin-left:12px}
.links a{padding:8px 12px;border-radius:8px;color:var(--ink);font-weight:500;font-size:14.5px}
.links a:hover{background:var(--bg);text-decoration:none}
.links a.on{color:var(--blue);background:var(--blue-l)}
.nav .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:4px}
.menu{position:relative}
.menu-panel{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,29,55,.14);min-width:210px;padding:6px;display:none}
.menu.open .menu-panel{display:block}
.menu-panel a,.menu-panel button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:var(--ink);background:none;border:0;cursor:pointer;font-size:14px;align-items:center;justify-content:space-between}
.menu-panel a:hover,.menu-panel button:hover{background:var(--bg);text-decoration:none}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.md{width:46px;height:46px;font-size:16px}

/* buttons / forms */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;font-size:14.5px;transition:background .15s}
.btn:hover{background:var(--navy2);text-decoration:none}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-d);color:#fff}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:#fff;color:var(--err);border-color:#f3c5bf}
.btn.danger:hover{background:var(--err-bg)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px;color:var(--navy)}
.in,select.in,textarea.in{width:100%;border:1px solid #cfd8e6;border-radius:10px;padding:10px 12px;background:#fff;font-size:14.5px}
.in:focus{border-color:var(--blue);outline:3px solid #cfdcfb}
textarea.in{min-height:110px;resize:vertical}
.field{margin-bottom:14px}
.err-t{color:var(--err);font-size:13px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card.link{display:block;color:inherit;transition:border-color .15s,box-shadow .15s}
.card.link:hover{border-color:#b9c7dd;box-shadow:0 6px 20px rgba(10,29,55,.08);text-decoration:none}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-size:12px;font-weight:600}
.tag.gold{background:#fbf0cf;color:#7a5a00}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.gray{background:#eef1f6;color:var(--mut)}
.price{font-weight:800;color:var(--navy)}
.sect{padding:54px 0}
.sect.tight{padding:30px 0}
.sect-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.thumb{height:130px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;position:relative}
.thumb span{background:rgba(10,29,55,.55);padding:3px 9px;border-radius:6px;font-size:12px}
.stars{color:var(--gold);font-weight:700}

/* hero */
.hero{background:linear-gradient(180deg,#fff 0%,#eef3fb 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-top:44px;padding-bottom:40px}
.hero p.lead{font-size:18px;color:var(--mut);margin:16px 0 22px;max-width:520px}
.search{display:flex;background:#fff;border:1px solid #cfd8e6;border-radius:14px;padding:6px;gap:6px;box-shadow:0 10px 30px rgba(10,29,55,.08);max-width:620px}
.search select{border:0;border-right:1px solid var(--line);border-radius:0;padding:0 10px;background:none;font-weight:600;width:130px;cursor:pointer}
.search input{border:0;flex:1;padding:10px;min-width:0;outline:none;background:none}
.hero-img{position:relative}
.hero-img img{width:100%;height:auto;max-height:430px;object-fit:cover;object-position:60% 20%;border-radius:20px;display:block;background:var(--navy)}
.hero-img .float{max-width:calc(100% - 24px);position:absolute;left:-18px;bottom:22px;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 12px 30px rgba(10,29,55,.2);font-size:13px}
.actions4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-26px;position:relative;z-index:2}
.act{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;color:inherit;box-shadow:0 8px 22px rgba(10,29,55,.06)}
.act:hover{text-decoration:none;border-color:var(--gold)}
.act .ic{width:42px;height:42px;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.act b{display:block;color:var(--navy)}
.disc{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);background:#fff;border-radius:12px;color:inherit;cursor:pointer;width:100%;text-align:left}
.disc:hover{border-color:var(--gold);text-decoration:none}
.disc .ic{font-size:22px}
.stats{background:var(--navy);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}
.stats b{display:block;font-size:32px;color:var(--gold);font-weight:800}
.stats span{color:#c9d5e8;font-size:14px}

/* lists */
.jobrow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);color:inherit;background:#fff}
.jobrow:last-child{border-bottom:0}
.jobrow:hover{background:#fafcff;text-decoration:none}
.filters{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr;gap:10px;margin-bottom:18px}
.page-h{padding:30px 0 18px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}
.empty{text-align:center;padding:46px 20px;color:var(--mut);background:#fff;border:1px dashed #c8d3e3;border-radius:14px}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}
.split{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:600}
.desc{white-space:pre-wrap;word-wrap:break-word}

/* tabs / tables */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.t th{text-align:left;padding:10px 12px;background:#f1f4f9;color:var(--mut);font-weight:600;font-size:12.5px}
table.t td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi b{display:block;font-size:28px;color:var(--navy);font-weight:800}

/* auth */
.auth{max-width:460px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 34px rgba(10,29,55,.08)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid #cfd8e6;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:#fff}
.seg input{margin-top:4px}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 label{border:1px solid #cfd8e6;border-radius:10px;padding:12px;cursor:pointer;text-align:center;font-weight:600;background:#fff}
.seg3 label:has(input:checked){border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.seg3 input{display:none}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(10,29,55,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal h3{font-size:20px;margin-bottom:14px}
#toasts{position:fixed;right:16px;top:78px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;border-left:4px solid var(--gold)}
.toast.err{border-color:#ef4444;background:#7f1d1d}
.toast.ok{border-color:#22c55e}

/* messages */
.msgs{display:grid;grid-template-columns:300px 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:540px}
.convs{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit;align-items:center}
.conv:hover,.conv.on{background:#f3f7ff;text-decoration:none}
.thread{display:flex;flex-direction:column;max-height:640px}
.thread-b{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:#f8fafd}
.bub{max-width:76%;padding:9px 13px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.thread-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* faq */
details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0}
details.faq+details.faq{margin-top:10px}
details.faq summary{padding:14px 18px;cursor:pointer;font-weight:600;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:20px;color:var(--gold-d);line-height:1}
details.faq[open] summary::after{content:"–"}
details.faq div{padding:0 18px 16px;color:var(--mut)}

/* chat widget */
#chatFab{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--gold);color:var(--navy);border:0;border-radius:99px;padding:13px 20px;font-weight:700;cursor:pointer;box-shadow:0 10px 28px rgba(10,29,55,.35);display:flex;gap:8px;align-items:center}
#chatBox{position:fixed;right:20px;bottom:20px;z-index:70;width:360px;max-width:calc(100vw - 24px);height:520px;max-height:calc(100vh - 40px);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(10,29,55,.4);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
#chatBox.open{display:flex}
.chat-h{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-h b{color:#fff}
.chat-b{flex:1;overflow:auto;padding:14px;background:#f8fafd;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid #c5d3ea;background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--blue);font-weight:600}
.chip:hover{background:var(--blue-l)}
.chat-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

/* footer */
footer{background:var(--navy);color:#c9d5e8;margin-top:40px;padding:44px 0 26px}
footer h4{color:#fff;margin-bottom:12px;font-size:15px}
footer a{color:#c9d5e8;display:block;padding:3px 0;font-size:14px}
footer a:hover{color:var(--gold);text-decoration:none}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
.price-card{display:flex;flex-direction:column;gap:12px}
.price-card.best{border:2px solid var(--gold);position:relative}
.price-card ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.price-card li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.price-big{font-size:34px;font-weight:800;color:var(--navy)}

@media (max-width:980px){
  .hero-in,.split{grid-template-columns:1fr}
  .hero-img .float{left:12px}
  .actions4,.grid4,.kpis{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .burger{display:block}
  .links{display:none;position:absolute;left:0;right:0;top:66px;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;padding:10px 16px;margin:0}
  .links.open{display:flex}
  .nav .right .hide-m{display:none}
  .msgs{grid-template-columns:1fr}
  .convs{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .jobrow{flex-wrap:wrap}.jobrow>div:last-child{text-align:left!important;white-space:normal!important}
  .only-s{display:block}.nav .right .hide-s{display:none}
  .brand{font-size:17px}.nav{gap:8px}.nav .right{gap:6px}.brand svg{width:30px;height:30px}
  .grid2,.grid3,.grid4,.actions4,.kpis,.filters,.stats{grid-template-columns:1fr}
  .search{flex-wrap:wrap}.search select{width:100%;border-right:0;padding:10px}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<header class="top"><div class="wrap nav" id="nav"></div></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="modalRoot"></div>
<button id="chatFab" data-act="chat-open" aria-label="Open support chat">💬 Help</button>
<section id="chatBox" aria-label="Support chat"></section>
<script>
/* ============ ENGINEX — Engineering Marketplace & Jobs ============ */
/* Edit CONFIG to put YOUR real support contact details on the Support page. */
const CONFIG = {
  currency: 'SAR',
  support: {
    phone: '',        // e.g. '+966 5X XXX XXXX'  (leave '' to hide)
    whatsapp: '',     // e.g. '966500000000' (digits only, no +)
    email: '',        // e.g. 'support@yourdomain.com'
    hours: 'Sun–Thu, 9:00–18:00 (KSA)'
  },
  admin: { name: 'ENGINEX Admin', email: 'admin@enginex.com', password: 'Admin@123' } // OFFLINE PREVIEW ONLY (file:// or no server). Online, the admin is set with ADMIN_EMAIL / ADMIN_PASSWORD on the server.
};

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const mem = {};
let lsOK = true;
try { localStorage.setItem('ex:t', '1'); localStorage.removeItem('ex:t'); } catch (e) { lsOK = false; }
let SERVER = false, TOKEN = (()=>{try{return localStorage.getItem('ex:token')}catch(e){return null}})(), SRV = { bank:{}, gateway:false, prices:{}, feature:{} };
const LOCALK = new Set(['session','guesttix']), cache = {}; let pend = {}, timer = null;
const api = (p, o = {}) => fetch(p, { ...o, headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }, body: o.body ? JSON.stringify(o.body) : undefined }).then(r => r.json().then(j => (r.ok ? j : Promise.reject(j))));
let SERVER_CHECKED = false;
async function loadServer() {
  try {
    const r = await fetch('/api/state', { headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} });
    if (!r.ok) throw 0;
    const j = await r.json(); if (!j || !j.state) throw 0;
    for (const k in cache) if (!LOCALK.has(k) && !pend[k]) delete cache[k];
    Object.assign(cache, ...Object.entries(j.state).map(([k, v]) => pend[k] ? {} : { [k]: JSON.stringify(v) }));
    SRV = j; SERVER = true; SERVER_CHECKED = true;
    if (TOKEN && !j.me) { TOKEN = null; try { localStorage.removeItem('ex:token'); } catch (e) {} DB.set('session', null); } // expired login
  } catch (e) {
    if (!SERVER_CHECKED) { SERVER_CHECKED = true; try { const h = await fetch('/api/health'); SERVER = h.ok && (await h.json()).ok === true; } catch (_) { SERVER = false; } }
  }
}
const ANON_KEYS = new Set(['listings', 'tickets', 'news', 'tcount']);
function flush() { const p = pend; pend = {}; timer = null; for (const k in p) { if (!TOKEN && !ANON_KEYS.has(k)) continue; api('/api/kv/' + encodeURIComponent(k), { method: 'PUT', body: { v: JSON.parse(p[k]) } }).catch(() => toast('Could not save to the server.', 'err')); } }
const DB = {
  get(k, d) { if (SERVER || cache[k] !== undefined) { try { const v = LOCALK.has(k) ? localStorage.getItem('ex:' + k) : cache[k]; return v ? JSON.parse(v) : d; } catch (e) { return d; } } return DB._get(k, d); },
  set(k, v) { if (!SERVER) return DB._set(k, v); const s = JSON.stringify(v); if (LOCALK.has(k)) { try { localStorage.setItem('ex:' + k, s); } catch (e) {} return; } cache[k] = s; pend[k] = s; clearTimeout(timer); timer = setTimeout(flush, 250); },
  _get(k, d) { try { const v = lsOK ? localStorage.getItem('ex:' + k) : mem[k]; return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  _set(k, v) { const s = JSON.stringify(v); try { if (lsOK) localStorage.setItem('ex:' + k, s); else mem[k] = s; } catch (e) { mem[k] = s; toast('Browser storage is full or blocked — changes may not be kept.', 'err'); } }
};

/* ---------- helpers ---------- */

async function hash(p) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('enginex|' + p));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h = 5381; const s = 'enginex|' + p; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'x' + h.toString(16);
}

function sendMsg(from, to, text, noAuto) {
  const ts = getThreads(); const k = tkey(from, to);
  let th = ts.find(t => t.key === k);
  if (!th) { th = { key: k, users: [from, to], msgs: [], read: {} }; ts.push(th); }
  th.msgs.push({ from, text, t: now() }); th.read[from] = now();
  DB.set('threads', ts);
  const target = userById(to);
  if (target?.demo && !noAuto) setTimeout(() => {
    const ts2 = getThreads(); const t2 = ts2.find(t => t.key === k); if (!t2) return;
    t2.msgs.push({ from: to, text: target.role === 'engineer' ? `Hi ${userById(from)?.name?.split(' ')[0] || ''}, thanks for reaching out. I'm available — send the scope and drawings and I'll come back with a quote. (Automatic demo reply)` : `Thank you for your message. Our team will review and get back to you shortly. (Automatic demo reply)`, t: now(), auto: true });

function render() {

  const gate = () => { if (!u) { S.next = location.hash; toast('Please sign in to continue.'); setTimeout(() => go('#/signin'), 0); return false; } return true; };
  try {
    switch (p[0]) {
      case undefined: html = vHome(); break;
      case 'marketplace': html = vBrowse('service', r.q); break;
      case 'jobs': html = vBrowse('job', r.q); break;
      case 'projects': html = vBrowse('project', r.q); break;
      case 'engineers': html = vBrowse('engineer', r.q); break;
      case 'engineer': html = vProfile(p[1]); break;
      case 'listing': html = vListing(p[1]); break;
      case 'signin': html = u ? (setTimeout(() => go('#/dashboard'), 0), '') : vSignin(); break;
      case 'register': html = u ? (setTimeout(() => go('#/dashboard'), 0), '') : vRegister(r.q); break;
      case 'post': if (!gate()) return; html = vPost(r.q); break;
      case 'dashboard': if (!gate()) return; html = vDash(p[1] || 'overview', p[2]); break;
      case 'messages': if (!gate()) return; html = vMessages(p[1], r.q); break;
      case 'support': html = vSupport(); break;
      case 'pricing': html = vPricing(); break;
      case 'about': html = vAbout(); break;
      default: html = `<div class="wrap sect"><div class="empty"><b>Page not found</b>Check the address or go back <a href="#/">home</a>.</div></div>`;
    }
  } catch (err) { console.error(err); html = `<div class="wrap sect"><div class="empty"><b>Something went wrong</b>${esc(err.message)}. <a href="#/">Go home</a></div></div>`; }
  $('#app').innerHTML = html;
  renderChrome();
  const links = $('#links'); links && links.classList.remove('open');
  after(p);
  if (!location.hash.includes('#faq') && !(p[0] === 'messages')) window.scrollTo(0, 0);
}
function after(p) {
  if (p[0] === 'messages') { const b = $('.thread-b'); if (b) b.scrollTop = b.scrollHeight; }
  if (p[0] === 'support' && location.hash.endsWith('#faq')) $('#faq')?.scrollIntoView();
  const pf = $('form[data-form="post"]'); if (pf) syncPostType(pf);
}
window.addEventListener('hashchange', render);

function priceText(l) {

  return `<span class="muted small">Budget</span> <span class="price">${money(l.price)}</span>`;

const GR = [['#0A1D37', '#1D4ED8'], ['#12305a', '#0f766e'], ['#1e3a8a', '#6d28d9'], ['#0f3d3e', '#2563eb'], ['#3a2a10', '#b6870f'], ['#102a43', '#486581']];
function grad(d) { let h = 0; for (const c of String(d)) h = (h * 31 + c.charCodeAt(0)) >>> 0; const [a, b] = GR[h % GR.length]; return `linear-gradient(135deg,${a},${b})`; }

/* ---------- browse ---------- */
const BROWSE = {
  service: { title: 'Marketplace', sub: 'Ready-to-order engineering services.', cta: 'Post a service', ph: 'Search services…' },
  job: { title: 'Engineering jobs', sub: 'Roles from employers across the region.', cta: 'Post a job', ph: 'Search jobs…' },
  project: { title: 'Projects', sub: 'Open projects accepting proposals.', cta: 'Post a project', ph: 'Search projects…' },
  engineer: { title: 'Engineers', sub: 'Find and contact engineering professionals.', cta: '', ph: 'Search name, skill or title…' }
};
function vBrowse(type, q) {
  const f = F[type];
  if (q.q != null) f.q = q.q; if (q.d != null) f.d = q.d;
  const c = BROWSE[type];
  const cities = type === 'engineer' ? [...new Set(getUsers().filter(u => u.role === 'engineer').map(u => u.city))].sort() : CITIES;
  const sorts = type === 'engineer' ? [['rating', 'Top rated'], ['exp', 'Most experienced'], ['rate', 'Lowest rate']] : [['new', 'Newest'], ['low', 'Price: low to high'], ['high', 'Price: high to low']];
  return `<div class="wrap"><div class="page-h row between"><div><h1 style="font-size:32px">${c.title}</h1><p class="muted">${c.sub}</p></div>${c.cta ? `<a class="btn gold" href="#/post?type=${type}">+ ${c.cta}</a>` : ''}</div>
    <div class="filters"><input class="in" data-f="${type}.q" value="${esc(f.q)}" placeholder="${c.ph}" aria-label="Search">
      <select class="in" data-f="${type}.d" aria-label="Discipline">${opt(DISC_N, f.d, 'All disciplines')}</select>
      <select class="in" data-f="${type}.loc" aria-label="Location">${opt(cities, f.loc, 'All locations')}</select>
      ${type === 'job' ? `<select class="in" data-f="job.jt" aria-label="Job type">${opt(JOBTYPES, f.jt, 'All job types')}</select>` : `<select class="in" data-f="${type}.s" aria-label="Sort">${sorts.map(([v, t]) => `<option value="${v}" ${f.s === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`}</div>
    <div class="row between small muted" style="margin-bottom:12px"><span id="count"></span><button class="btn ghost sm" data-act="clear" data-type="${type}">Clear filters</button></div>
    <div id="results">${resultsHTML(type)}</div></div><div style="height:30px"></div>`;
}
function resultsHTML(type) {
  const f = F[type]; const q = (f.q || '').toLowerCase().trim(); let a;
  if (type === 'engineer') {
    a = getUsers().filter(u => u.role === 'engineer');
    if (q) a = a.filter(u => [u.name, u.headline, u.discipline, u.city, (u.skills || []).join(' ')].join(' ').toLowerCase().includes(q));
    if (f.d) a = a.filter(u => u.discipline === f.d); if (f.loc) a = a.filter(u => u.city === f.loc);
    a.sort((x, y) => f.s === 'exp' ? (y.exp || 0) - (x.exp || 0) : f.s === 'rate' ? (x.rate || 1e9) - (y.rate || 1e9) : (y.rating || 0) - (x.rating || 0));
  } else {
    a = getListings().filter(l => l.type === type && l.status === 'open');
    if (q) a = a.filter(l => [l.title, l.desc, l.discipline, l.location, userById(l.owner)?.name, userById(l.owner)?.company].join(' ').toLowerCase().includes(q));
    if (f.d) a = a.filter(l => l.discipline === f.d); if (f.loc) a = a.filter(l => l.location === f.loc);
    if (f.jt) a = a.filter(l => l.extra.jobType === f.jt);
    a.sort((x, y) => f.s === 'low' ? x.price - y.price : f.s === 'high' ? y.price - x.price : y.created - x.created);
  }
  setTimeout(() => { const c = $('#count'); if (c) c.textContent = a.length + ' result' + (a.length === 1 ? '' : 's'); }, 0);
  if (!a.length) return `<div class="empty"><b>No results</b>Try different keywords or clear the filters.${type !== 'engineer' ? ` Or <a href="#/post?type=${type}">post one yourself</a>.` : ''}</div>`;
  if (type === 'job') return `<div class="card pad0">${a.map(jobRow).join('')}</div>`;
  if (type === 'engineer') return `<div class="grid3">${a.map(engineerCard).join('')}</div>`;
  return `<div class="grid3">${a.map(type === 'service' ? serviceCard : projectCard).join('')}</div>`;
}

function vListing(id) {

  if (!S.viewed.has(id)) { S.viewed.add(id); const all = getListings(); const x = all.find(i => i.id === id); x.views = (x.views || 0) + 1; DB.set('listings', all); }
  const u = me(); const o = userById(l.owner); const mine = u && u.id === l.owner;
  const saved = u && (DB.get('saves', {})[u.id] || []).includes(l.id);
  const apps = getApps().filter(a => a.listingId === l.id);
  const myApp = u && apps.find(a => a.userId === u.id && a.status !== 'withdrawn');
  const back = { service: ['marketplace', 'Marketplace'], job: ['jobs', 'Jobs'], project: ['projects', 'Projects'] }[l.type];
  const cta = l.type === 'service' ? 'Order this service' : l.type === 'job' ? 'Apply now' : 'Submit proposal';
  const act = l.type === 'service' ? 'order' : l.type === 'job' ? 'apply' : 'propose';
  const rows = [['Category', l.discipline], ['Location', l.location]];
  if (l.type === 'service') rows.push(['Delivery', (l.extra.delivery || '—') + ' days']);
  if (l.type === 'job') rows.push(['Job type', l.extra.jobType || '—'], ['Level', l.extra.level || '—']);

  if (l.extra.deadline) rows.push(['Deadline', l.extra.deadline]);
  rows.push(['Posted', ago(l.created)], ['Views', l.views || 0]);
  return `<div class="wrap"><div class="page-h"><div class="crumb"><a href="#/${back[0]}">${back[1]}</a> / ${esc(l.discipline)}</div>

    <aside class="stack" style="position:sticky;top:84px">
      <div class="card"><div style="font-size:22px">${priceText(l)}</div>
        ${l.status === 'closed' ? '<p class="muted" style="margin-top:12px">This listing is closed.</p>' : mine ? `<p class="muted small" style="margin-top:12px">This is your listing.</p><a class="btn block ghost" style="margin-top:10px" href="#/post?edit=${l.id}">Edit listing</a>` :
      myApp ? `<div class="tag ok" style="margin:12px 0">You already ${l.type === 'service' ? 'ordered' : 'applied'} · ${esc(myApp.status)}</div><a class="btn ghost block" href="#/dashboard/apps">View my applications</a>` :
        `<button class="btn gold block" style="margin-top:14px" data-act="${act}" data-id="${l.id}">${cta}</button>`}

      <a class="card link" href="#/engineer/${o?.id}"><div class="row" style="flex-wrap:nowrap">${avatar(o, 'md')}<div><div style="font-weight:700;color:var(--navy)">${esc(o?.name || 'Unknown')}</div><div class="small muted">${esc(o?.company || o?.headline || '')}</div>${o?.rating ? `<div class="stars small">★ ${o.rating} · ${o.done} jobs</div>` : ''}</div></div></a>

function ownerPanel(l, apps) {

/* ---------- post an ad ---------- */
function vPost(q) {
  const u = me(); const edit = q.edit ? listingById(q.edit) : null;
  if (q.edit && (!edit || (edit.owner !== u.id && !isAdmin()))) return `<div class="wrap sect"><div class="empty"><b>You can't edit this listing</b><a href="#/dashboard/ads">Back to my ads</a></div></div>`;
  const t = edit ? edit.type : (['service', 'job', 'project'].includes(q.type) ? q.type : (u.role === 'employer' ? 'job' : 'service'));
  const x = edit?.extra || {}; const left = adLimit(u) - activeAds(u.id);
  return `<div class="wrap"><div class="page-h"><h1 style="font-size:30px">${edit ? 'Edit your ad' : 'Post an ad'}</h1>
    <p class="muted">${edit ? 'Update the details below.' : `You can have ${adLimit(u) >= 9999 ? 'unlimited' : adLimit(u)} active ads on your plan${adLimit(u) < 9999 ? ` — ${Math.max(left, 0)} left. <a href="#/pricing">Upgrade</a>` : ''}.`}</p></div>
    <form class="card" data-form="post" data-edit="${edit?.id || ''}" novalidate style="max-width:820px">
      <div class="field"><label class="f">Ad type</label><div class="seg3">${[['service', '🛠️ Service'], ['job', '💼 Job'], ['project', '📣 Project']].map(([v, n]) => `<label><input type="radio" name="type" value="${v}" ${t === v ? 'checked' : ''} ${edit ? 'disabled' : ''}>${n}</label>`).join('')}</div>
        ${edit ? `<input type="hidden" name="type" value="${edit.type}">` : ''}<div class="hint" id="typehint"></div></div>
      <div class="field"><label class="f" for="pt">Title</label><input class="in" id="pt" name="title" maxlength="120" value="${esc(edit?.title || '')}" placeholder="e.g. Electrical design for a 10-storey building"></div>
      <div class="grid2"><div class="field"><label class="f" for="pd">Discipline</label><select class="in" id="pd" name="discipline">${opt(DISC_N, edit?.discipline || u.discipline || '', 'Select…')}</select></div>
      <div class="field"><label class="f" for="pl">Location</label><select class="in" id="pl" name="location">${opt(CITIES, edit?.location || u.city || '', 'Select…')}</select></div></div>
      <div class="field"><label class="f" for="pp"><span id="pricelabel">Price</span> (${CONFIG.currency})</label><input class="in" id="pp" name="price" type="number" min="1" step="1" value="${esc(edit?.price ?? '')}"></div>
      <div class="x x-service grid2"><div class="field"><label class="f" for="pdl">Delivery time (days)</label><input class="in" id="pdl" name="delivery" type="number" min="1" value="${esc(x.delivery || '')}"></div></div>
      <div class="x x-job grid2"><div class="field"><label class="f">Job type</label><select class="in" name="jobType">${opt(JOBTYPES, x.jobType || 'Full-time')}</select></div><div class="field"><label class="f">Experience level</label><select class="in" name="level">${opt(LEVELS, x.level || LEVELS[1])}</select></div></div>
      <div class="x x-project grid2"><div class="field"><label class="f">Expected duration</label><input class="in" name="duration" value="${esc(x.duration || '')}" placeholder="e.g. 6 weeks"></div><div class="field"><label class="f">Pricing model</label><select class="in" name="bids">${opt(['Fixed price', 'Hourly or fixed'], x.bids || 'Fixed price')}</select></div></div>
      <div class="x x-job x-project field"><label class="f">Application deadline (optional)</label><input class="in" name="deadline" type="date" value="${esc(x.deadline || '')}"></div>
      <div class="field"><label class="f" for="pdesc">Description</label><textarea class="in" id="pdesc" name="desc" rows="8" placeholder="Scope, deliverables, requirements, standards…">${esc(edit?.desc || '')}</textarea><div class="hint">Minimum 40 characters. Do not include phone numbers or passwords.</div></div>
      <div class="err-t" data-err></div><div class="row" style="margin-top:8px"><button class="btn gold">${edit ? 'Save changes' : 'Publish ad'}</button><a class="btn ghost" href="${edit ? '#/dashboard/ads' : '#/dashboard'}">Cancel</a></div></form></div><div style="height:30px"></div>`;
}
function syncPostType(form) {
  const t = (form.querySelector('[name=type]:checked') || form.querySelector('[name=type]')).value;
  $$('.x', form).forEach(e => e.classList.toggle('hide', !e.classList.contains('x-' + t)));
  const lab = { service: 'Starting price', job: 'Monthly salary', project: 'Budget' }[t];
  $('#pricelabel', form).textContent = lab;
  $('#typehint').textContent = { service: 'Sell a fixed-scope service buyers can order.', job: 'Hire an employee, contractor or freelancer.', project: 'Describe a project and receive proposals.' }[t];
}

/* ---------- dashboard ---------- */
function vDash(tab, sub) {
  const u = me();
  const tabs = [['overview', 'Overview'], ['ads', 'My ads'], ['apps', 'My applications'], ['received', 'Received'], ['saved', 'Saved'], ['support', 'Support tickets'], ['profile', 'Profile']];
  tabs.splice(6, 0, ['billing', 'Billing']); if (u.role === 'admin') tabs.push(['payments', 'Payments'], ['desk', 'Support desk'], ['users', 'Users'], ['allads', 'All ads']);
  if (!tabs.some(t => t[0] === tab)) tab = 'overview';
  let body = '';
  if (tab === 'overview') body = dOverview(u); else if (tab === 'ads') body = dAds(u); else if (tab === 'apps') body = dApps(u);
  else if (tab === 'received') body = dReceived(u); else if (tab === 'saved') body = dSaved(u); else if (tab === 'support') body = dSupport(u, sub);
  else if (tab === 'profile') body = dProfile(u); else if (tab === 'billing' || (u.role === 'admin' && tab === 'payments')) body = dBilling(u, tab === 'payments'); else if (u.role === 'admin' && tab === 'desk') body = dDesk(sub); else if (u.role === 'admin' && tab === 'users') body = dUsers(); else if (u.role === 'admin') body = dAllAds();
  return `<div class="wrap"><div class="page-h row between"><div><h1 style="font-size:30px">Dashboard</h1><p class="muted">Signed in as ${esc(u.name)} · ${u.role === 'engineer' ? 'Engineer' : u.role === 'employer' ? 'Employer' : 'Administrator'} · ${(PLANS[u.plan] || PLANS.basic).name} plan</p></div><a class="btn gold" href="#/post">+ Post an ad</a></div>
    <div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" onclick="location.hash='#/dashboard/${k}'">${n}</button>`).join('')}</div>${body}</div><div style="height:30px"></div>`;
}
function dOverview(u) {
  const mine = getListings().filter(l => l.owner === u.id); const my = getApps().filter(a => a.userId === u.id);
  const rec = getApps().filter(a => listingById(a.listingId)?.owner === u.id);
  const views = mine.reduce((n, l) => n + (l.views || 0), 0);
  const recent = [...my.map(a => ({ a, kind: 'sent' })), ...rec.map(a => ({ a, kind: 'got' }))].sort((x, y) => y.a.t - x.a.t).slice(0, 6);
  return `<div class="kpis"><div class="card kpi"><span class="muted small">Active ads</span><b>${mine.filter(l => l.status === 'open').length}</b></div><div class="card kpi"><span class="muted small">Ad views</span><b>${views}</b></div>
    <div class="card kpi"><span class="muted small">Sent applications</span><b>${my.length}</b></div><div class="card kpi"><span class="muted small">Received responses</span><b>${rec.length}</b></div></div>
    <div class="grid2"><div class="card"><h3 style="margin-bottom:10px">Recent activity</h3>${recent.length ? recent.map(({ a, kind }) => { const l = listingById(a.listingId); return `<div style="padding:8px 0;border-top:1px solid var(--line)" class="small">${kind === 'sent' ? 'You responded to' : esc(userById(a.userId)?.name || 'Someone') + ' responded to'} <a href="#/listing/${a.listingId}">${esc(l?.title || 'a listing')}</a> <span class="muted">· ${ago(a.t)}</span></div>`; }).join('') : '<p class="muted">Nothing yet. Browse <a href="#/jobs">jobs</a> or <a href="#/post">post an ad</a>.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:10px">Quick actions</h3><div class="stack"><a class="btn ghost block" href="#/post">Post a new ad</a><a class="btn ghost block" href="#/messages">Open messages ${unreadCount(u.id) ? `<span class="badge">${unreadCount(u.id)}</span>` : ''}</a><a class="btn ghost block" href="#/dashboard/profile">Complete my profile</a><a class="btn ghost block" href="#/support">Ask support a question</a></div></div></div>`;
}
function dAds(u) {
  const mine = getListings().filter(l => l.owner === u.id).sort((a, b) => b.created - a.created);
  if (!mine.length) return `<div class="empty"><b>You have no ads yet</b>Post your first service, job or project. <a href="#/post">Post an ad</a></div>`;
  return `<div class="tw"><table class="t"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Responses</th><th>Views</th><th></th></tr></thead><tbody>${mine.map(l => `<tr><td><a href="#/listing/${l.id}"><b>${esc(l.title)}</b></a><div class="small muted">${ago(l.created)}</div></td><td>${l.type}</td><td><span class="tag ${l.status === 'open' ? 'ok' : 'gray'}">${l.status}</span></td><td>${getApps().filter(a => a.listingId === l.id).length}</td><td>${l.views || 0}</td>
    <td><div class="row" style="flex-wrap:nowrap;gap:6px"><a class="btn ghost sm" href="#/post?edit=${l.id}">Edit</a><button class="btn ghost sm" data-act="${l.status === 'open' ? 'ad-close' : 'ad-open'}" data-id="${l.id}">${l.status === 'open' ? 'Close' : 'Reopen'}</button><button class="btn danger sm" data-act="ad-del" data-id="${l.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function dApps(u) {
  const my = getApps().filter(a => a.userId === u.id).sort((a, b) => b.t - a.t);
  if (!my.length) return `<div class="empty"><b>No applications yet</b>Apply to a <a href="#/jobs">job</a>, send a proposal on a <a href="#/projects">project</a>, or order a <a href="#/marketplace">service</a>.</div>`;
  return `<div class="tw"><table class="t"><thead><tr><th>Listing</th><th>Type</th><th>Amount</th><th>Status</th><th>Sent</th><th></th></tr></thead><tbody>${my.map(a => { const l = listingById(a.listingId); const st = { pending: 'warn', accepted: 'ok', rejected: 'err', withdrawn: 'gray' }[a.status];
    return `<tr><td>${l ? `<a href="#/listing/${l.id}"><b>${esc(l.title)}</b></a>` : '<i class="muted">Listing removed</i>'}</td><td>${a.kind}</td><td>${a.amount ? money(a.amount) : '—'}</td><td><span class="tag ${st}">${a.status}</span></td><td class="small muted">${ago(a.t)}</td><td>${a.status === 'pending' ? `<button class="btn ghost sm" data-act="app-withdraw" data-id="${a.id}">Withdraw</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function dReceived(u) {
  const rec = getApps().filter(a => listingById(a.listingId)?.owner === u.id).sort((a, b) => b.t - a.t);
  if (!rec.length) return `<div class="empty"><b>No responses yet</b>Applications, proposals and orders on your ads will appear here.</div>`;
  return `<div class="card">${rec.map(a => `<div class="small muted" style="padding-top:8px">On <a href="#/listing/${a.listingId}">${esc(listingById(a.listingId)?.title)}</a></div>` + appRow(a, true)).join('')}</div>`;
}
function dSaved(u) {
  const ids = DB.get('saves', {})[u.id] || []; const ls = ids.map(listingById).filter(Boolean);
  if (!ls.length) return `<div class="empty"><b>Nothing saved</b>Use “Save for later” on any listing to keep it here.</div>`;
  return `<div class="card pad0">${ls.map(l => `<div class="jobrow"><a href="#/listing/${l.id}" style="flex:1"><b style="color:var(--navy)">${esc(l.title)}</b><div class="small muted">${l.type} · ${esc(l.location)}</div></a><div class="row">${priceText(l)}<button class="btn ghost sm" data-act="save" data-id="${l.id}">Remove</button></div></div>`).join('')}</div>`;
}
function dProfile(u) {
  return `<form class="card" data-form="profile" style="max-width:760px" novalidate><div class="grid2"><div class="field"><label class="f">Full name</label><input class="in" name="name" value="${esc(u.name)}"></div><div class="field"><label class="f">City</label><select class="in" name="city">${opt(CITIES, u.city || '', 'Select…')}</select></div></div>
    ${u.role === 'employer' ? `<div class="field"><label class="f">Company</label><input class="in" name="company" value="${esc(u.company || '')}"></div>` : ''}
    <div class="field"><label class="f">Headline</label><input class="in" name="headline" maxlength="90" value="${esc(u.headline || '')}" placeholder="e.g. Electrical engineer — power & lighting design"></div>
    ${u.role === 'engineer' ? `<div class="grid3"><div class="field"><label class="f">Discipline</label><select class="in" name="discipline">${opt(DISC_N, u.discipline || '', 'Select…')}</select></div><div class="field"><label class="f">Years of experience</label><input class="in" type="number" min="0" max="60" name="exp" value="${esc(u.exp ?? '')}"></div><div class="field"><label class="f">Hourly rate (${CONFIG.currency})</label><input class="in" type="number" min="0" name="rate" value="${esc(u.rate ?? '')}"></div></div>
    <div class="field"><label class="f">Skills (comma separated)</label><input class="in" name="skills" value="${esc((u.skills || []).join(', '))}" placeholder="AutoCAD, Revit, ETAP"></div>` : ''}
    <div class="field"><label class="f">About</label><textarea class="in" name="bio" rows="5">${esc(u.bio || '')}</textarea></div>
    <div class="err-t" data-err></div><button class="btn gold">Save profile</button></form>
    <form class="card" data-form="chpass" style="max-width:760px;margin-top:18px" novalidate><h3 style="margin-bottom:12px">Change password</h3><div class="grid2"><div class="field"><label class="f">Current password</label><input class="in" type="password" name="cur" autocomplete="current-password"></div><div class="field"><label class="f">New password</label><input class="in" type="password" name="np" autocomplete="new-password"></div></div><div class="err-t" data-err></div><button class="btn">Update password</button></form>`;
}

/* ---- tickets (shared) ---- */
function ticketThread(t, admin) {
  const st = { open: 'warn', in_progress: 'blue', resolved: 'ok' }[t.status] || 'gray';
  return `<div class="card"><div class="row between"><div><div class="small muted">${t.id} · ${esc(t.category)} · opened ${fdate(t.created)}</div><h3 style="margin-top:2px">${esc(t.subject)}</h3><div class="small muted">${esc(t.name)} · ${esc(t.email)}</div></div><span class="tag ${st === 'blue' ? '' : st}">${t.status.replace('_', ' ')}</span></div>
    <div style="margin:14px 0;display:grid;gap:8px">${t.replies.map(r => `<div class="bub ${r.by === 'agent' ? 'them' : 'me'}" style="max-width:100%;${r.by === 'agent' ? 'border-color:#f1dc9b;background:#fffaf0' : ''}"><b style="font-size:12px">${r.by === 'agent' ? 'ENGINEX Support' : esc(r.name)}</b><br>${esc(r.text)}<small>${fdate(r.t)}</small></div>`).join('')}</div>
    ${t.status === 'resolved' && !admin ? `<p class="small muted">This ticket is resolved. Reply below to reopen it.</p>` : ''}
    <form data-form="ticket-reply" data-id="${t.id}" data-admin="${admin ? 1 : ''}"><textarea class="in" name="text" rows="3" placeholder="${admin ? 'Write a reply to the customer…' : 'Add a message…'}"></textarea><div class="err-t" data-err></div><div class="row" style="margin-top:8px"><button class="btn sm gold">${admin ? 'Send reply' : 'Send message'}</button></div></form>
    ${admin ? `<form data-form="ticket-status" data-id="${t.id}" class="row" style="margin-top:12px"><label class="small">Status</label><select class="in" name="status" style="width:auto">${['open', 'in_progress', 'resolved'].map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}</select><button class="btn ghost sm">Update status</button></form>` : ''}</div>`;
}
function dSupport(u, sub) {
  const mine = getTickets().filter(t => t.userId === u.id || t.email === u.email.toLowerCase()).sort((a, b) => b.updated - a.updated);
  const open = sub && mine.find(t => t.id === sub);
  if (open) return `<a href="#/dashboard/support" class="small">← All tickets</a><div style="margin-top:10px">${ticketThread(open, false)}</div>`;
  return `<div class="row between" style="margin-bottom:12px"><p class="muted">Your conversations with ENGINEX support.</p><a class="btn gold sm" href="#/support">New ticket</a></div>` + (mine.length ? `<div class="tw"><table class="t"><thead><tr><th>Ticket</th><th>Subject</th><th>Status</th><th>Updated</th></tr></thead><tbody>${mine.map(t => `<tr><td><a href="#/dashboard/support/${t.id}"><b>${t.id}</b></a></td><td>${esc(t.subject)}</td><td><span class="tag ${{ open: 'warn', in_progress: '', resolved: 'ok' }[t.status]}">${t.status.replace('_', ' ')}</span></td><td class="small muted">${ago(t.updated)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><b>No tickets</b>Need help? <a href="#/support">Contact support</a>.</div>`);
}
function dDesk(sub) {
  const all = getTickets().sort((a, b) => b.updated - a.updated); const cur = sub && all.find(t => t.id === sub);
  if (cur) return `<a href="#/dashboard/desk" class="small">← All tickets</a><div style="margin-top:10px">${ticketThread(cur, true)}</div>`;
  const f = S.adminFilter; const list = all.filter(t => f === 'all' || t.status === f);
  return `<div class="row between" style="margin-bottom:12px"><div class="row">${['all', 'open', 'in_progress', 'resolved'].map(s => `<button class="btn sm ${f === s ? '' : 'ghost'}" data-act="desk-filter" data-f="${s}">${s.replace('_', ' ')} ${s === 'all' ? '' : '(' + all.filter(t => t.status === s).length + ')'}</button>`).join('')}</div><span class="small muted">${all.length} total</span></div>
    ${list.length ? `<div class="tw"><table class="t"><thead><tr><th>Ticket</th><th>From</th><th>Category</th><th>Subject</th><th>Status</th><th>Updated</th></tr></thead><tbody>${list.map(t => `<tr><td><a href="#/dashboard/desk/${t.id}"><b>${t.id}</b></a></td><td>${esc(t.name)}<div class="small muted">${esc(t.email)}</div></td><td>${esc(t.category)}</td><td>${esc(t.subject)}</td><td><span class="tag ${{ open: 'warn', in_progress: '', resolved: 'ok' }[t.status]}">${t.status.replace('_', ' ')}</span></td><td class="small muted">${ago(t.updated)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><b>No tickets here</b>New support requests will show up in this queue.</div>'}`;
}
let ORDERS = null;
function dBilling(u, admin) {
  if (!SERVER) return '<div class="card" style="padding:20px">Billing needs the ENGINEX server (run <b>node server.js</b>).</div>';
  if (ORDERS === null) { ORDERS = []; api('/api/pay/orders').then(o => { ORDERS = o; render(); }).catch(() => {}); }
  const rows = ORDERS.map(o => `<tr><td>${esc(o.id)}</td>${admin ? `<td>${esc(o.userName)}<br><span class="small muted">${esc(o.email)}</span></td>` : ''}<td>${esc(o.label)}</td><td>${money(o.amount)}</td><td>${esc(o.method)}${o.ref ? '<br><span class="small muted">ref ' + esc(o.ref) + '</span>' : ''}</td><td><span class="tag">${esc(o.status)}</span></td><td>${admin && o.status === 'pending' ? `<button class="btn sm gold" data-act="pay-decide" data-id="${o.id}" data-ok="1">Approve</button> <button class="btn sm ghost" data-act="pay-decide" data-id="${o.id}" data-ok="0">Reject</button>` : fdate(o.created)}</td></tr>`).join('');
  return `<p class="muted" style="margin-bottom:12px">${admin ? 'All payments. Approve bank transfers after checking your bank statement.' : 'Your payments and plan upgrades.'} <a href="#/dashboard/${admin ? 'payments' : 'billing'}" onclick="ORDERS=null">Refresh</a></p><div class="tw"><table class="t"><thead><tr><th>Order</th>${admin ? '<th>Member</th>' : ''}<th>Item</th><th>Amount</th><th>Method</th><th>Status</th><th>${admin ? 'Action' : 'Date'}</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="muted">No payments yet.</td></tr>'}</tbody></table></div>`;
}
function payModal(kind, item, label, amount) {

const FORMS = {
  'home-search': d => go(`#/${d.t}?q=${encodeURIComponent(d.q || '')}`),
  async receipt(d) { await api('/api/pay/receipt', { method: 'POST', body: d }); closeModal(); toast('Thanks — we will confirm your payment shortly.', 'ok'); go('#/dashboard/billing'); },
  news: d => { if (!validEmail(d.email || '')) return toast('Enter a valid email address.', 'err'); DB.set('news', [...DB.get('news', []), { email: d.email, t: now() }]); toast('Subscribed. Thanks!', 'ok'); $('form[data-form=news]').reset(); },
  async login(d) {
    const em = (d.email || '').trim().toLowerCase(); if (!validEmail(em) || !d.password) return 'Enter your email and password.';
    let u;
    if (SERVER) { try { const r = await api('/api/login', { method: 'POST', body: { email: em, hash: await hash(d.password) } }); TOKEN = r.token; localStorage.setItem('ex:token', TOKEN); await loadServer(); u = userById(r.id); } catch (e) { return 'Email or password is incorrect.'; } }
    else { u = getUsers().find(x => (x.email || '').toLowerCase() === em); if (!u || u.pass !== await hash(d.password)) return 'Email or password is incorrect.'; }
    DB.set('session', u.id); S.tracked = null; chatInit(); chatRender(); toast(`Welcome back, ${u.name.split(' ')[0]}.`, 'ok'); const n = S.next || '#/dashboard'; S.next = null; go(n);
  },
  async register(d) {
    const name = (d.name || '').trim(), em = (d.email || '').trim().toLowerCase();
    if (name.length < 3) return 'Enter your full name.'; if (!validEmail(em)) return 'Enter a valid email address.';
    if (!d.password || d.password.length < 8 || !/[A-Za-z]/.test(d.password) || !/\d/.test(d.password)) return 'Password needs 8+ characters with at least one letter and one number.';
    if (d.password !== d.password2) return 'The two passwords do not match.'; if (!d.terms) return 'Please accept the terms to continue.';
    if (!SERVER && getUsers().some(u => (u.email || '').toLowerCase() === em)) return 'An account with this email already exists. Try signing in.';
    const role = d.role === 'employer' ? 'employer' : 'engineer';
    const u = { id: 'u_' + uid(), name, email: em, pass: await hash(d.password), role, city: d.city, discipline: d.discipline || '', headline: '', bio: '', skills: [], plan: 'basic', created: now() };
    if (SERVER) { try { const r = await api('/api/register', { method: 'POST', body: { user: u } }); u.id = r.id; TOKEN = r.token; localStorage.setItem('ex:token', TOKEN); await loadServer(); } catch (e) { return 'An account with this email already exists. Try signing in.'; } }
    else DB.set('users', [...getUsers(), u]);
    DB.set('session', u.id); S.tracked = null; chatInit(); chatRender(); toast('Account created. Welcome to ENGINEX!', 'ok');
    const n = S.next || '#/dashboard/profile'; S.next = null; go(n);
  },
  post(d, f) {
    const u = me(); const edit = f.dataset.edit ? listingById(f.dataset.edit) : null; const t = d.type;
    if ((d.title || '').trim().length < 8) return 'Title must be at least 8 characters.'; if (!d.discipline) return 'Choose a discipline.'; if (!d.location) return 'Choose a location.';
    const price = Number(d.price); if (!price || price < 1) return 'Enter a price greater than zero.'; if ((d.desc || '').trim().length < 40) return 'Description must be at least 40 characters.';
    if (t === 'service' && !(Number(d.delivery) >= 1)) return 'Enter the delivery time in days.'; if (t === 'project' && !(d.duration || '').trim()) return 'Enter the expected project duration.';
    if (!edit && activeAds(u.id) >= adLimit(u)) return `You have reached the ${adLimit(u)}-ad limit on the ${PLANS[u.plan || 'basic'].name} plan. Close an ad or upgrade on the Pricing page.`;
    const extra = t === 'service' ? { delivery: Number(d.delivery), pricing: 'Starting at' } : t === 'job' ? { jobType: d.jobType, level: d.level, deadline: d.deadline || '' } : { duration: d.duration.trim(), bids: d.bids, deadline: d.deadline || '' };
    const base = { title: d.title.trim(), discipline: d.discipline, location: d.location, price, desc: d.desc.trim(), extra };
    if (edit) { setListing(edit.id, l => ({ ...l, ...base })); toast('Changes saved.', 'ok'); go('#/listing/' + edit.id); }
    else { const l = { id: 'l_' + uid(), type: t, owner: u.id, status: 'open', created: now(), views: 0, ...base }; DB.set('listings', [l, ...getListings()]); toast('Published — your ad is live.', 'ok'); go('#/listing/' + l.id); }
  },
  apply(d, f) {
    const u = me(); const l = listingById(f.dataset.id); const kind = f.dataset.kind; if (!l || l.status !== 'open') return 'This listing is no longer open.';
    if ((d.message || '').trim().length < 20) return 'Please write at least 20 characters.';
    if (kind === 'propose' && !(Number(d.amount) > 0)) return 'Enter your price.';
    if (getApps().some(a => a.listingId === l.id && a.userId === u.id && a.status !== 'withdrawn')) return 'You have already responded to this listing.';
    const a = { id: 'a_' + uid(), listingId: l.id, userId: u.id, ownerId: l.owner, kind, message: d.message.trim(), amount: kind === 'order' ? l.price : Number(d.amount) || 0, days: Number(d.days) || 0, status: 'pending', t: now() };
    DB.set('apps', [...getApps(), a]);
    sendMsg(u.id, l.owner, `New ${kind === 'order' ? 'order' : kind === 'propose' ? 'proposal' : 'application'} on “${l.title}”.\n\n${a.message}`, true);
    closeModal(); toast(kind === 'order' ? 'Order placed. The seller has been notified.' : 'Sent. The poster has been notified.', 'ok'); render();
  },
  profile(d) {
    const u = me(); if ((d.name || '').trim().length < 3) return 'Name is too short.';
    Object.assign(u, { name: d.name.trim(), city: d.city, headline: (d.headline || '').trim(), bio: (d.bio || '').trim() });
    if (u.role === 'employer') u.company = (d.company || '').trim();
    if (u.role === 'engineer') Object.assign(u, { discipline: d.discipline, exp: d.exp === '' ? undefined : Number(d.exp), rate: d.rate === '' ? undefined : Number(d.rate), skills: (d.skills || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 12) });
    saveUser(u); toast('Profile saved.', 'ok'); render();
  },
  async chpass(d) {
    const u = me();
    if (!d.np || d.np.length < 8 || !/[A-Za-z]/.test(d.np) || !/\d/.test(d.np)) return 'New password needs 8+ characters with a letter and a number.';
    if (SERVER) { try { await api('/api/password', { method: 'POST', body: { current: await hash(d.cur || ''), next: await hash(d.np) } }); } catch (e) { return (e && e.error) || 'Could not change the password.'; } }
    else { if (u.pass !== await hash(d.cur || '')) return 'Current password is incorrect.'; u.pass = await hash(d.np); saveUser(u); } toast('Password updated.', 'ok'); $('form[data-form=chpass]').reset();
  },
  'send-msg'(d, f) { const u = me(); if ((d.text || '').trim().length < 2) return 'Write a message first.'; sendMsg(u.id, f.dataset.to, (f.dataset.ctx ? `Re: ${f.dataset.ctx}\n\n` : '') + d.text.trim()); closeModal(); toast('Message sent. Find it under Messages.', 'ok'); renderChrome(); },
  'thread-send'(d, f) { const u = me(); if (!(d.text || '').trim()) return; sendMsg(u.id, f.dataset.to, d.text.trim()); render(); setTimeout(() => $('.thread-f input')?.focus(), 0); },
  'ticket-new'(d) {
    const u = me(); const name = (d.name || '').trim(), em = (d.email || '').trim();
    if (name.length < 2) return 'Enter your name.'; if (!validEmail(em)) return 'Enter a valid email so we can reply.'; if (!d.category) return 'Choose a topic.';
    if ((d.subject || '').trim().length < 5) return 'Add a short subject.'; if ((d.message || '').trim().length < 15) return 'Please describe your question in at least 15 characters.';
    const t = createTicket({ userId: u?.id, name, email: em, category: d.category, subject: d.subject.trim(), message: d.message.trim() });
    t.replies.push({ by: 'agent', name: 'ENGINEX Support', text: `Thanks ${name.split(' ')[0]} — we have received your request (reference ${t.id}). A support agent will reply here. You can track it any time with your ticket number and email. (Automatic message)`, t: now() }); saveTicket(t);
    if (!u) DB.set('guesttix', [...DB.get('guesttix', []), t.id]);
    S.tracked = t.id; closeModal(); toast(`Ticket ${t.id} created.`, 'ok'); if (parse().parts[0] === 'support') render(); else go('#/support');
  },
  'ticket-reply'(d, f) {
    const t = getTickets().find(x => x.id === f.dataset.id); const u = me(); const admin = f.dataset.admin === '1' && u?.role === 'admin';
    if ((d.text || '').trim().length < 2) return 'Write a message first.';
    t.replies.push({ by: admin ? 'agent' : 'user', name: admin ? 'ENGINEX Support' : (u?.name || t.name), text: d.text.trim(), t: now() }); t.updated = now();
    if (admin && t.status === 'open') t.status = 'in_progress'; if (!admin && t.status === 'resolved') t.status = 'open';
    saveTicket(t); toast('Sent.', 'ok'); render();
  },
  'ticket-status'(d, f) { const t = getTickets().find(x => x.id === f.dataset.id); t.status = d.status; t.updated = now(); saveTicket(t); toast('Status updated.', 'ok'); render(); },
  'ticket-track'(d, f) {
    const t = getTickets().find(x => x.id.toLowerCase() === (d.id || '').trim().toLowerCase());
    if (!t || t.email !== (d.email || '').trim().toLowerCase()) return 'No ticket matches that number and email.';
    S.tracked = t.id; render();
  },
  'chat-send'(d) { const v = (d.text || '').trim(); if (v) chatUser(v); }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const h = FORMS[f.dataset.form]; if (!h) return;
  const eln = $('[data-err]', f); if (eln) eln.textContent = '';
  try { const err = await h(Object.fromEntries(new FormData(f)), f); if (err) showErr(f, err); } catch (x) { console.error(x); showErr(f, 'Something went wrong: ' + x.message); }
});

/* ---------- support chat assistant ---------- */
function chatInit() {
  S.chat = { msgs: [{ from: 'bot', text: 'Hi! I\'m the ENGINEX assistant. Ask me anything about accounts, ads, jobs or plans — or talk to a person.', chips: ['How do I post an ad?', 'Create an account', 'How do I apply for a job?', 'Talk to a person'] }], step: null, draft: {} };
}
function chatRender() {
  const box = $('#chatBox'); const c = S.chat; box.classList.toggle('open', S.chatOpen); $('#chatFab').classList.toggle('hide', S.chatOpen);
  if (!S.chatOpen) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="chat-h"><div><b>ENGINEX Support</b><div class="small" style="color:#c9d5e8">Assistant · instant answers</div></div><button class="btn sm ghost" data-act="chat-close" aria-label="Close chat">✕</button></div>
    <div class="chat-b" id="chatB">${c.msgs.map(m => `<div class="bub ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}${m.link ? ` <a href="${m.link}" ${m.link.startsWith('#') ? '' : 'target="_blank"'}>${esc(m.linkText || 'Open')}</a>` : ''}${m.chips ? `<div class="chips">${m.chips.map(t => `<button class="chip" data-act="chip" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}</div>`).join('')}</div>
    <form class="chat-f" data-form="chat-send"><input class="in" name="text" placeholder="Type your question…" autocomplete="off" aria-label="Your question"><button class="btn gold sm">Send</button></form>`;
  const b = $('#chatB'); b.scrollTop = b.scrollHeight; $('.chat-f input', box).focus();
}
function botSay(text, extra = {}) { S.chat.msgs.push({ from: 'bot', text, ...extra }); }
function chatUser(text) {
  const c = S.chat; c.msgs.push({ from: 'me', text }); const u = me(); const low = text.toLowerCase();
  if (c.step === 'issue') {
    c.draft.message = text;
    if (u) { makeChatTicket(u.name, u.email); } else { c.step = 'email'; botSay('Thanks. What email address should the support team reply to?'); }
  } else if (c.step === 'email') {
    if (!validEmail(text.trim())) botSay('That doesn\'t look like a valid email. Please type it again (e.g. name@company.com).');
    else makeChatTicket(text.trim().split('@')[0], text.trim());
  } else if (/\b(person|human|agent|ticket|helpline|call)\b/.test(low)) {
    c.step = 'issue'; botSay('Sure. Please describe your question in one message and I\'ll send it to the support team as a ticket.');
  } else if (/^(hi|hello|hey|salam|assalam|مرحبا)\b/.test(low)) {
    botSay('Hello! What can I help you with?', { chips: ['How do I post an ad?', 'Create an account', 'Talk to a person'] });
  } else if (/^(thanks|thank you|shukran)/.test(low)) {
    botSay('You\'re welcome! Anything else?');
  } else {
    let best = null, score = 0; FAQ.forEach(([q, a, kw]) => { const s = kw.filter(k => low.includes(k)).length + (low.includes(q.toLowerCase().slice(0, 12)) ? 2 : 0); if (s > score) { score = s; best = [q, a]; } });
    if (best) {
      const l = /post|ad\b|advert|listing/.test(low) ? ['#/post', 'Post an ad'] : /account|register|sign up|create/.test(low) ? ['#/register', 'Create account'] : /plan|pricing|upgrade/.test(low) ? ['#/pricing', 'See plans'] : /job|apply|proposal/.test(low) ? ['#/jobs', 'Browse jobs'] : null;
      botSay(best[1], { ...(l ? { link: l[0], linkText: l[1] } : {}), chips: ['Talk to a person'] });
    } else botSay('I\'m not sure about that one. I can send it to a support agent, or you can browse the FAQ.', { link: '#/support#faq', linkText: 'Open FAQ', chips: ['Talk to a person'] });
  }
  chatRender();
}
function makeChatTicket(name, email) {
  const c = S.chat; const u = me();
  const t = createTicket({ userId: u?.id, name, email, category: 'Other', subject: c.draft.message.slice(0, 60), message: c.draft.message });
  t.replies.push({ by: 'agent', name: 'ENGINEX Support', text: `Thanks — we received your request (reference ${t.id}). A support agent will reply here. (Automatic message)`, t: now() }); saveTicket(t);
  if (!u) DB.set('guesttix', [...DB.get('guesttix', []), t.id]);
  c.step = null; c.draft = {}; S.tracked = t.id;
  botSay(`Done — ticket ${t.id} has been created. ${u ? 'Follow the replies under Dashboard → Support tickets.' : 'Track it on the Support page with that number and your email.'}`, { link: u ? '#/dashboard/support/' + t.id : '#/support', linkText: 'View ticket' });
}

/* ---------- start ---------- */
(async function init() {
  await loadServer(); await ensureSeed(); if (SERVER) { setInterval(async () => { if (!Object.keys(pend).length) await loadServer(); }, 8000); } chatInit(); chatRender();
  if (!location.hash) location.hash = '#/'; else render();
  if (!location.hash || location.hash === '#/') render();
  let lastUn = -1; setInterval(() => { const u = me(); const n = u ? unreadCount(u.id) : 0; if (n !== lastUn) { lastUn = n; const open = $('#umenu')?.classList.contains('open'); renderChrome(); if (open) $('#umenu')?.classList.add('open'); } }, 4000);
})();
</script>
